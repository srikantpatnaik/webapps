<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Organizer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../responsive.css">
</head>
<body>
    <a href="../index.html" style="display:block;max-width:1200px;margin:0 auto 12px;color:#56c7ff;font:600 13px 'Segoe UI',system-ui,sans-serif;text-decoration:none;">← Back to dashboard</a>
    <div class="container">
        <!-- Fullscreen modal for image preview -->
        <div class="modal" id="imageModal">
            <span class="close" id="closeModal">&times;</span>
            <img class="modal-content" id="modalImage">
            <div class="modal-tags" id="modalTags"></div>
        </div>
        <header>
            <h1>Image Organizer</h1>
        </header>

        <main>
            <section class="gallery-section">
                <div class="gallery" id="imageGallery">
                    <!-- Images will be loaded here dynamically -->
                </div>
            </section>

            <section class="filter-section">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Paste image or Filter by tag">
                </div>
            </section>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
